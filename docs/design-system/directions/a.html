<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A 操作盤</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<script src="board.js"></script>
<style>
  :root { --bg:#131416; --case:#26292d; --case-hi:#2f3338; --glass:#0b0c0d; --ink:#e9e6df; --dim:#8d9096; --led:#ffb02e; --ok:#5fd394; --slow:#ef6a4f; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; min-height:100dvh; display:flex; }
  .mono { font-family:'DM Mono',ui-monospace,monospace; font-feature-settings:'tnum' 1; }
  nav { width:184px; flex:none; border-right:1px solid #222428; padding:20px 12px; }
  nav b { display:block; font-size:14px; padding:0 10px 18px; }
  nav a { display:block; padding:9px 10px; color:var(--dim); text-decoration:none; font-size:14px; }
  nav a.on { color:var(--ink); background:var(--case); border-radius:6px; }
  main { flex:1; padding:24px 32px; max-width:1100px; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; color:var(--dim); font-size:14px; }
  .bar .mode { color:var(--ink); }
  /* 筐体: 角丸は金属ケースの角。影ではなく上面の明るい縁で厚みを出す */
  .case { background:var(--case); border-radius:18px; border-top:1px solid #3a3e44; padding:22px; }
  .top { display:grid; grid-template-columns:1.25fr 1fr; gap:22px; margin-bottom:18px; }
  .tuner { background:var(--glass); border-radius:10px; padding:16px 20px 12px; display:grid; grid-template-columns:auto 1fr; gap:4px 22px; align-items:center; }
  .note { font-size:112px; line-height:1; color:var(--led); font-weight:500; grid-row:span 2; }
  .q { font-size:16px; }
  .q small { color:var(--dim); display:block; font-size:13px; }
  .gauge svg { width:100%; display:block; }
  .reads { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .read { background:var(--glass); border-radius:10px; padding:12px 14px; }
  .read span { color:var(--dim); font-size:12px; display:block; }
  .read b { font-size:28px; font-weight:500; }
  .read b i { font-style:normal; font-size:14px; color:var(--dim); margin-left:3px; }
  .window { background:var(--glass); border-radius:10px; padding:8px 10px; margin-bottom:18px; }
  .keys { display:grid; grid-template-columns:repeat(6,1fr); gap:12px 14px; }
  /* フットスイッチ: 丸い踏み板を模す。押した鍵だけ状態色の輪 */
  .key { aspect-ratio:1.5; border-radius:12px; background:var(--case-hi); border:1px solid #3c4046; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; font-size:22px; color:var(--ink); }
  .key::after { content:''; width:10px; height:10px; border-radius:50%; background:#1b1d20; }
  .key.ok { border-color:var(--ok); }
  .key.ok::after { background:var(--ok); }
  .bottom { display:none; }
  @media (max-width:640px) {
    body { display:block; padding-bottom:64px; }
    nav { display:none; }
    main { padding:14px 12px; }
    .case { padding:12px; border-radius:14px; }
    .top { grid-template-columns:1fr; gap:10px; margin-bottom:10px; }
    .tuner { padding:12px 14px 8px; gap:2px 14px; }
    .note { font-size:84px; }
    .reads { grid-template-columns:repeat(3,1fr); gap:8px; }
    .read { padding:8px 10px; }
    .read b { font-size:20px; }
    .read.hide-m { display:none; }
    .window { margin-bottom:10px; padding:4px; }
    .keys { grid-template-columns:repeat(4,1fr); gap:8px; }
    .key { font-size:19px; aspect-ratio:1.35; }
    .bottom { display:flex; position:fixed; bottom:0; left:0; right:0; height:60px; background:#1a1b1e; border-top:1px solid #26282c; justify-content:space-around; align-items:center; font-size:12px; color:var(--dim); }
    .bottom .on { color:var(--led); }
  }
</style></head>
<body>
<nav><b>指板トレーナー</b><a>ホーム</a><a class="on">練習</a><a>理論</a><a>成績</a><a>設定</a></nav>
<main>
  <div class="bar"><span class="mode">基本 ・ 位置→音名 ・ 6〜1弦 0〜12F</span><span class="mono">8 / 15 問</span></div>
  <div class="case">
    <div class="top">
      <div class="tuner">
        <div class="note mono">E</div>
        <div class="q">5弦 7フレット<small>正解。前の問題より 0.21 秒速い</small></div>
        <div class="gauge" id="gauge"></div>
      </div>
      <div class="reads">
        <div class="read"><span>今回の反応</span><b class="mono">0.86<i>秒</i></b></div>
        <div class="read"><span>このセルの前回</span><b class="mono">1.42<i>秒</i></b></div>
        <div class="read"><span>正答</span><b class="mono">7/7</b></div>
        <div class="read hide-m"><span>今日の平均</span><b class="mono">1.18<i>秒</i></b></div>
      </div>
    </div>
    <div class="window" id="board"></div>
    <div class="keys mono">
      <div class="key">C</div><div class="key">C♯</div><div class="key">D</div><div class="key">D♯</div><div class="key ok">E</div><div class="key">F</div>
      <div class="key">F♯</div><div class="key">G</div><div class="key">G♯</div><div class="key">A</div><div class="key">A♯</div><div class="key">B</div>
    </div>
  </div>
</main>
<div class="bottom"><span>ホーム</span><span class="on">練習</span><span>理論</span><span>成績</span><span>設定</span></div>
<script>
  drawBoard(document.getElementById('board'), { target:{s:4,f:7}, label:'E', len:1000,
    c:{ wood:'#17130f', fret:'#6b6f75', nut:'#d8d2c4', string:'#b9b4aa', inlay:'#4a4640', mark:'#ffb02e', markText:'#131416', ring:'#5fd394', label:'#6b6f75' } });
  // 反応時間のメーター: 0〜3秒。1秒未満が「反射」の帯
  const g = document.getElementById('gauge'), t = 0.86, max = 3;
  const x = s => 10 + (s / max) * 380;
  let ticks = '';
  for (let s = 0; s <= 30; s++) { const big = s % 10 === 0; ticks += `<line x1="${x(s/10)}" y1="${big?8:14}" x2="${x(s/10)}" y2="26" stroke="#5a5e64" stroke-width="${big?2:1}"/>`; if (big) ticks += `<text x="${x(s/10)}" y="44" fill="#8d9096" font-size="12" text-anchor="middle" font-family="DM Mono">${s/10}s</text>`; }
  g.innerHTML = `<svg viewBox="0 0 400 50"><rect x="${x(0)}" y="26" width="${x(1)-x(0)}" height="4" fill="#5fd394"/><rect x="${x(1)}" y="26" width="${x(2)-x(1)}" height="4" fill="#ffb02e"/><rect x="${x(2)}" y="26" width="${x(3)-x(2)}" height="4" fill="#ef6a4f"/>${ticks}<line x1="${x(t)}" y1="0" x2="${x(t)}" y2="30" stroke="#ffb02e" stroke-width="3"/></svg>`;
</script>
</body></html>
