<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B 色面ポスター</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<script src="board.js"></script>
<style>
  :root { --navy:#1c2636; --navy-2:#253147; --field:#e07a26; --field-deep:#c9661a; --cream:#f6ead6; --ink-on-field:#1c2636; --ok:#7fe0a8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--navy); color:var(--cream); font:15px/1.6 system-ui,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif; min-height:100dvh; display:flex; }
  .mono { font-family:'DM Mono',ui-monospace,monospace; font-feature-settings:'tnum' 1; }
  nav { width:184px; flex:none; padding:20px 12px; }
  nav b { display:block; font-size:14px; padding:0 10px 18px; }
  nav a { display:block; padding:9px 10px; color:#9aa6ba; font-size:14px; }
  nav a.on { color:var(--cream); background:var(--navy-2); border-radius:6px; }
  main { flex:1; display:flex; flex-direction:column; min-height:100dvh; }
  /* 色面: 画面の主役。ポスターのように端まで塗り、指板の線だけを置く */
  .field { flex:1; background:var(--field); color:var(--ink-on-field); padding:28px 40px 20px; position:relative; }
  .head { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .prompt { font-size:44px; font-weight:800; line-height:1.15; letter-spacing:-0.01em; }
  .prompt small { display:block; font-size:15px; font-weight:500; opacity:.8; letter-spacing:0; }
  .time { text-align:right; }
  .time b { font-size:72px; font-weight:500; line-height:1; }
  .time b i { font-size:20px; font-style:normal; }
  .time span { display:block; font-size:14px; }
  .meta { display:flex; gap:24px; font-size:14px; margin-top:6px; }
  .board-h { margin:0 -40px; }
  .board-v { display:none; }
  .keys { background:var(--navy); padding:16px 40px 22px; display:grid; grid-template-columns:repeat(12,1fr); gap:8px; }
  .key { height:64px; border-radius:6px; background:var(--navy-2); display:flex; align-items:center; justify-content:center; font-size:21px; }
  .key.ok { background:var(--ok); color:var(--navy); }
  .bottom { display:none; }
  @media (max-width:640px) {
    body { display:block; padding-bottom:60px; }
    nav { display:none; }
    main { min-height:0; }
    .field { padding:16px 16px 0; display:grid; grid-template-columns:1fr 132px; gap:0 8px; }
    .head { display:block; grid-column:2; grid-row:1; }
    .prompt { font-size:28px; }
    .time { text-align:left; margin-top:14px; }
    .time b { font-size:44px; }
    .meta { flex-direction:column; gap:2px; font-size:13px; }
    .board-h { display:none; }
    .board-v { display:block; grid-column:1; grid-row:1; margin:-16px 0 0 -16px; }
    .keys { grid-template-columns:repeat(6,1fr); padding:12px; gap:6px; }
    .key { height:52px; font-size:18px; }
    .bottom { display:flex; position:fixed; bottom:0; left:0; right:0; height:58px; background:#141c29; justify-content:space-around; align-items:center; font-size:12px; color:#9aa6ba; }
    .bottom .on { color:var(--field); }
  }
</style></head>
<body>
<nav><b>指板トレーナー</b><a>ホーム</a><a class="on">練習</a><a>理論</a><a>成績</a><a>設定</a></nav>
<main>
  <section class="field">
    <div class="head">
      <div class="prompt">5弦 7フレット<small>この位置の音名は？ 正解は E</small></div>
      <div class="time"><b class="mono">0.86<i>秒</i></b><span>このセルの前回 1.42秒</span>
        <div class="meta mono"><span>8 / 15 問</span><span>正答 7/7</span></div></div>
    </div>
    <div class="board-h" id="bh"></div>
    <div class="board-v" id="bv"></div>
  </section>
  <div class="keys mono">
    <div class="key">C</div><div class="key">C♯</div><div class="key">D</div><div class="key">D♯</div><div class="key ok">E</div><div class="key">F</div>
    <div class="key">F♯</div><div class="key">G</div><div class="key">G♯</div><div class="key">A</div><div class="key">A♯</div><div class="key">B</div>
  </div>
</main>
<div class="bottom"><span>ホーム</span><span class="on">練習</span><span>理論</span><span>成績</span><span>設定</span></div>
<script>
  const c = { fret:'#1c2636', nut:'#1c2636', string:'#f6ead6', inlay:'#f6ead6', mark:'#1c2636', markText:'#f6ead6', ring:'#1c2636', label:'#1c2636' };
  drawBoard(document.getElementById('bh'), { target:{s:4,f:7}, label:'E', len:760, c });
  drawBoard(document.getElementById('bv'), { orient:'v', frets:9, target:{s:4,f:7}, label:'E', len:640, c });
</script>
</body></html>
